<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrova - Ferretería</title>

    <style>

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg,#f5f7fa,#dce8f5);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .contenedor{
            width:90%;
            max-width:1750px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            text-align:center;
        }

        .banner{
            width:100%;
            height:auto;
            display:block;
        }

        .contenido{
            padding:40px;
        }

        h1{
            color:#003366;
            font-size:2rem;
            margin-bottom:15px;
        }

        p{
            color:#666;
            font-size:1.1rem;
            line-height:1.6;
            margin-bottom:30px;
        }

    </style>
</head>
<body>

    <div class="contenedor">

        <img src="Ferrova.png" alt="Banner Ferrova" class="banner">

        <div class="contenido">
            <h1>¡Bienvenido a FERROVA!</h1>

            <p>
                Mi nombre es <strong>Harold Rodrigo Ari Escobar</strong>.
                Gracias por visitar nuestro sitio web. Aquí encontrarás
                herramientas, materiales de construcción y productos de
                ferretería de la mejor calidad.
            </p>

        </div>

    </div>

</body>
</html>
