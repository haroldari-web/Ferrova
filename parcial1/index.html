<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café el Trigal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Café el Trigal</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#cafe">Nuestro Café</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <main>
        <section id="#cafe">
            <h2>Nuestro Café</h2>
            <p>En Café el Trigal ofrecemos bebidas preparadas con café de calidad.</p>
            <ul>
                <li>Café americano - Bs 12.</li>
                <li>Capuchino - Bs 18.</li>
                <li>Submarino - Bs 15.</li>
            </ul>
        </section>

        <section id="#contacto">
            <h2>Haz tu pedido</h2>
            <form>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required>
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required>
                <label for="pedido">Tu pedido</label>
                <textarea id="pedido"></textarea>
            </form>
            <button type="button" id="btn-confirmar">Confirmar pedido</button>
            <p id="mensaje" class="oculto"></p>
        </section>
    </main>

    <footer>
        Parcial 1 - Harold Rodrigo Ari Escobar - 3 de Agosto de 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
